# ---------------------------------------------------------------------------
# CI pipeline for Wayfarer.
#
# LEARNING NOTE: This is the quality gate. It runs on every pull request and
# every push to main: install → build → E2E tests. Vercel handles the
# deployment side separately via its git integration — so the mental model is
#   GitHub Actions  = "is this change good?"   (tests)
#   Vercel          = "ship it"                (preview per branch, prod on main)
# Later we can make Vercel wait for this check before promoting to production.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The app reads its Supabase connection details from the environment, and
    # fails fast if they're missing — so CI has to supply them or the build
    # won't even compile. These come from GitHub repository secrets
    # (Settings → Secrets and variables → Actions), never from committed files.
    #
    # Both values are safe to hold as secrets even though they ship to the
    # browser: the publishable key can only do what Row Level Security allows,
    # which for us is read the public destinations catalog.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
