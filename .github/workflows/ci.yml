# ---------------------------------------------------------------------------
# CI pipeline for Wayfarer.
#
# LEARNING NOTE: This is the quality gate. It runs on every pull request and
# every push to main: install → build → E2E tests. Vercel handles the
# deployment side separately via its git integration — so the mental model is
#   GitHub Actions  = "is this change good?"   (tests)
#   Vercel          = "ship it"                (preview per branch, prod on main)
# Later we can make Vercel wait for this check before promoting to production.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
